name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  CLAWS_VERSION: "4.3.1"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            autoconf
            automake
            libtool
            make
            intltool
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-gnutls
            mingw-w64-x86_64-libgcrypt
            mingw-w64-x86_64-enchant
            mingw-w64-x86_64-cppcheck
            mingw-w64-x86_64-clang-tools-extra

      - name: Cache Claws SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: .claws-sdk
          key: claws-sdk-${{ env.CLAWS_VERSION }}-mingw64

      - name: Build Claws SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: PREFIX="$PWD/.claws-sdk" bash ci/build-claws-sdk.sh

      - name: Static analysis (cppcheck)
        run: make cppcheck

      - name: Static analysis (clang-tidy)
        run: PKG_CONFIG_PATH="$PWD/.claws-sdk/lib/pkgconfig" make tidy
        continue-on-error: true

      - name: Build
        run: >-
          PKG_CONFIG_PATH="$PWD/.claws-sdk/lib/pkgconfig"
          make OS=Windows_NT
          CLAWS_LIBDIR="$PWD/.claws-sdk/lib"
          TMP="$(cygpath -w "$RUNNER_TEMP")"
          TEMP="$(cygpath -w "$RUNNER_TEMP")"

      - name: Unit tests
        run: make test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp_plugin
          path: build/mcp_plugin.dll
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mcp_plugin
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: mcp_plugin.dll
          generate_release_notes: true
