name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      claws_versions: ${{ steps.set.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: echo "versions=$(cat ci/claws-versions.json | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        claws_version: ${{ fromJSON(needs.versions.outputs.claws_versions) }}
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      CLAWS_VERSION: ${{ matrix.claws_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            autoconf
            automake
            libtool
            make
            intltool
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-gnutls
            mingw-w64-x86_64-libgcrypt
            mingw-w64-x86_64-enchant
            mingw-w64-x86_64-cppcheck
            mingw-w64-x86_64-clang-tools-extra

      - name: Cache Claws SDK
        id: sdk
        uses: actions/cache@v6
        with:
          path: .claws-sdk
          key: claws-sdk-${{ matrix.claws_version }}-mingw64

      - name: Build Claws SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: PREFIX="$PWD/.claws-sdk" bash ci/build-claws-sdk.sh

      - name: Determine plugin version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        run: >-
          PKG_CONFIG_PATH="$PWD/.claws-sdk/lib/pkgconfig"
          meson setup build -Dplugin_version="${{ steps.version.outputs.value }}"

      - name: Static analysis (cppcheck)
        run: meson compile -C build cppcheck

      - name: Static analysis (clang-tidy)
        run: meson compile -C build tidy
        continue-on-error: true

      - name: Build
        run: meson compile -C build

      - name: Unit tests
        run: meson test -C build

      - name: Rename artifact
        run: cp build/mcp_plugin.dll "mcp_plugin-windows-claws${{ matrix.claws_version }}.dll"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp_plugin-windows-claws${{ matrix.claws_version }}
          path: mcp_plugin-windows-claws${{ matrix.claws_version }}.dll
          if-no-files-found: error

  build-linux:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        claws_version: ${{ fromJSON(needs.versions.outputs.claws_versions) }}
    runs-on: ubuntu-latest
    env:
      CLAWS_VERSION: ${{ matrix.claws_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool make intltool pkg-config \
            meson ninja-build \
            libgtk-3-dev libglib2.0-dev libgnutls28-dev libgcrypt20-dev \
            libenchant-2-dev cppcheck clang-tidy

      - name: Cache Claws SDK
        id: sdk
        uses: actions/cache@v6
        with:
          path: .claws-sdk
          key: claws-sdk-${{ matrix.claws_version }}-linux

      - name: Build Claws SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: PREFIX="$PWD/.claws-sdk" bash ci/build-claws-sdk.sh

      - name: Determine plugin version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        run: >-
          PKG_CONFIG_PATH="$PWD/.claws-sdk/lib/pkgconfig"
          meson setup build -Dplugin_version="${{ steps.version.outputs.value }}"

      - name: Static analysis (cppcheck)
        run: meson compile -C build cppcheck

      - name: Static analysis (clang-tidy)
        run: meson compile -C build tidy
        continue-on-error: true

      - name: Build
        run: meson compile -C build

      - name: Unit tests
        run: meson test -C build

      - name: Rename artifact
        run: cp build/mcp_plugin.so "mcp_plugin-linux-claws${{ matrix.claws_version }}.so"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp_plugin-linux-claws${{ matrix.claws_version }}
          path: mcp_plugin-linux-claws${{ matrix.claws_version }}.so
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-windows, build-linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mcp_plugin-*
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-registry:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-windows, build-linux ]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set version in server.json
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$version" '.version = $v' packaging/registry/server.json > packaging/registry/server.tmp
          mv packaging/registry/server.tmp packaging/registry/server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Validate server.json
        run: ./mcp-publisher validate packaging/registry/server.json

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish packaging/registry/server.json
